# Three profiles (PHASES.md phase 0):
#   default: fast feedback while writing code
#   ci:      what the gate runs; more fuzz runs, deeper invariant campaigns
#   deep:    nightly and gate 7; long campaigns that find what `ci` misses
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"          # reproducible bytecode for verification
cbor_metadata = false
gas_reports = ["TicklineVault"]
# Warnings are errors in `ci` and `deep`, not here: local iteration stays fast.
fs_permissions = [{ access = "read", path = "../testdata" }]
# No network in any suite except test/fork (CLAUDE.md section 2).
no_match_path = "test/fork/*"

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true           # an unexpected revert in a handler is a finding, not noise
call_override = false
shrink_run_limit = 5000

[profile.ci]
deny = "warnings"
verbosity = 3

[profile.ci.fuzz]
runs = 5000
max_test_rejects = 500000

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true
shrink_run_limit = 100000

[profile.deep]
deny = "warnings"

[profile.deep.fuzz]
runs = 250000

[profile.deep.invariant]
runs = 5000
depth = 512
fail_on_revert = true

# The single suite allowed to touch the network (CLAUDE.md section 2), from #67.
#
# No eth_rpc_url here: this Foundry does not interpolate ${VAR} into it, and an uninterpolated value
# is treated as a file path, which fails before any test runs. The suite reads
# BASE_SEPOLIA_RPC_URL itself with vm.envString, so there is one place the endpoint comes from.
[profile.fork]
# no_match_path is inherited from [profile.default], which excludes exactly this directory, so it
# is pointed at a path that does not exist rather than left to exclude the suite it is selecting.
no_match_path = "test/nothing-is-here/*"
match_path = "test/fork/*"

# forge-lint, new in Foundry 1.8, and pointed at production Solidity only.
#
# Its loop, low-level-call and typecast rules are gas and safety advice for deployed code. A
# cross-stack vector reader is loops of staticcalls and casts of committed fixtures by construction,
# so in `test/` those rules fire 67 times and say nothing: the inputs are a file we generated, not a
# caller. `src/` keeps every rule, which is where the advice is worth taking.
[lint]
ignore = ["test/**/*.sol"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"              # uint256, never uint
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "params_first_multi"
sort_imports = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
