# gitleaks runs pre-commit and over full history in CI.
title = "Tickline"

[extend]
useDefault = true

[[rules]]
id = "evm-private-key"
description = "EVM private key (32-byte hex)"
regex = '''(?i)\b(0x)?[0-9a-f]{64}\b'''
keywords = ["0x"]
path = '''(?i)\.(rs|ts|tsx|sol|json|ya?ml|env|sh|toml)$'''

[allowlist]
description = "Well-known public test material only"
regexTarget = "match"
regexes = [
  # anvil's standard mnemonic accounts. Public by design, funded on no real chain.
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''',
  # zero-value placeholders
  '''0{64}''',
  # Public constants, not secrets, each one enumerated rather than allowed by path or by rule.
  # The scanner cannot tell a 32-byte constant from a 32-byte key, and these have to live in code:
  # a library that hashes signatures needs the curve order inline, and a generator needs its inputs.
  #
  # secp256k1's group order and its half, from SEC 2 section 2.4.1. The most public numbers in
  # elliptic-curve cryptography; EIP-2 is about the second one.
  '''fffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141''',
  '''7fffffffffffffffffffffffffffffff5d576e7357a4501ddfe92f46681b20a0''',
  # Channel and market salts in the vector generator: 63 zeros and a digit. Fixture inputs.
  '''0{63}[12]''',
  # The market id domain tag: "Tickline MarketId v1" as a right-padded bytes32, so it decodes to
  # ASCII text rather than to entropy (ADR-0013).
  '''5469636b6c696e65204d61726b65744964207631000000000000000000000000''',
  # Pyth's ETH/USD price feed id, published in their feed registry.
  '''ff61491a931112ddf1bd8147cd1b641375f79f5825126d665480874634fd0ace''',
]
paths = [
  '''(^|/)testdata/vectors/''',   # fixed keys are the point of a vector file
  '''(^|/)\.env\.example$''',
  '''(^|/)\.gitleaks\.toml$''',
]
