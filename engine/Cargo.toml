[workspace]
resolver = "2"
members = [
    "crates/lmsr",
    "crates/protocol",
    "crates/ledger",
    "crates/market",
    "crates/api",
    "crates/settlement",
    "crates/indexer",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

# Dependency versions live here so crates cannot drift apart (CLAUDE.md section 5).
[workspace.dependencies]
# workspace-internal
lmsr = { path = "crates/lmsr" }
protocol = { path = "crates/protocol" }
ledger = { path = "crates/ledger" }
market = { path = "crates/market" }
indexer = { path = "crates/indexer" }
settlement = { path = "crates/settlement" }

# errors: used everywhere, including the zero-IO crates
thiserror = "2.0"
# 256-bit integers for lmsr's Solady port (ADR-0008). Exact pin, no default features.
alloy-primitives = { version = "=1.7.3", default-features = false }

# IO layers only. lmsr and protocol must not reach for these
# (enforced by scripts/check-crate-boundaries.sh).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "bigdecimal", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"

# test-only
proptest = "1"
rstest = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Money math: a silent wrap or truncation is a lost-funds bug (CLAUDE.md section 1).
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[profile.test]
opt-level = 1        # proptest campaigns are unbearable at opt-level 0

[profile.release]
overflow-checks = true   # never trade an overflow check for speed near money
