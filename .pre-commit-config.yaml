# pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: no-skipped-tests
        name: no ignored, skipped, or focused tests
        entry: scripts/check-no-skipped-tests.sh
        language: system
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd engine && cargo fmt --all -- --check'
        language: system
        types: [rust]
        pass_filenames: false
