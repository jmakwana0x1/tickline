name: setup
description: Install the pinned Tickline toolchain. One place, so CI and dev-setup agree.

inputs:
  node:
    description: Install Node and pnpm
    default: 'true'
  foundry:
    description: Install Foundry
    default: 'true'
  sqlx:
    description: Install sqlx-cli
    default: 'false'
  uv:
    description: Install uv, which runs the Python reference oracle
    default: 'false'
  gate-tools:
    description: Install cargo-mutants and cargo-llvm-cov, which gates 1 and later use
    default: 'false'

runs:
  using: composite
  steps:
    - name: read pinned tool versions
      id: versions
      shell: bash
      run: grep -E '^export [A-Z_]+=' "$GITHUB_WORKSPACE/scripts/tool-versions.sh" | sed 's/^export //' >> "$GITHUB_OUTPUT"

    - name: rust (pinned by rust-toolchain.toml)
      shell: bash
      run: rustup show

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: engine

    - name: just
      uses: extractions/setup-just@v2

    - name: node + pnpm
      if: inputs.node == 'true'
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@v4
      if: inputs.node == 'true'
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: install workspace deps
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # Pinned, checksum-verified, and retried. The upstream action installs whatever
    # `stable` currently points at, so the gate could change meaning without a commit,
    # and its downloader has no retry, so a single connection reset turns a green commit
    # red (issue #11). Both are fixed here.
    - name: foundry (pinned v1.8.1, checksum-verified, retried)
      if: inputs.foundry == 'true'
      shell: bash
      env:
        FOUNDRY_VERSION: v1.8.1
        FOUNDRY_SHA256: 37b45855232e57624d90113b049ca54f0c92055bb5c1997fcbdc3076c7b89c10
      run: |
        set -euo pipefail
        dest="$HOME/.foundry/bin"
        mkdir -p "$dest"
        archive="/tmp/foundry.tar.gz"
        url="https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"

        for attempt in 1 2 3; do
          if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 \
               "$url" -o "$archive"; then
            break
          fi
          echo "::warning::foundry download attempt $attempt failed, retrying"
          sleep $(( attempt * 5 ))
        done

        echo "${FOUNDRY_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C "$dest"
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/forge" --version

    # solc is fetched by forge on first compile, from binaries.soliditylang.org, and that fetch is
    # the same single point of failure the foundry download was before #11: a connection reset there
    # failed the `sol` job on #80 with nothing wrong in the repository.
    #
    # So it is cached by version and warmed with retries. The version comes from foundry.toml, which
    # stays the one place it is pinned.
    - name: read the pinned solc version
      id: solc
      if: inputs.foundry == 'true'
      shell: bash
      run: |
        version="$(sed -n 's/^solc_version = "\(.*\)"/\1/p' contracts/foundry.toml | head -1)"
        [[ -n "$version" ]] || { echo "no solc_version in contracts/foundry.toml" >&2; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      if: inputs.foundry == 'true'
      with:
        path: ~/.svm
        key: svm-${{ runner.os }}-solc-${{ steps.solc.outputs.version }}

    - name: solc (pinned in foundry.toml), warmed and retried
      if: inputs.foundry == 'true'
      shell: bash
      run: |
        set -uo pipefail
        for attempt in 1 2 3; do
          if (cd contracts && forge build --silent); then
            exit 0
          fi
          echo "::warning::solc fetch or first build attempt $attempt failed, retrying"
          sleep $(( attempt * 5 ))
        done
        echo "::error::could not fetch solc ${{ steps.solc.outputs.version }} after three attempts" >&2
        exit 1

    # Pinned by commit (v10.1.0) and by uv version.
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      if: inputs.uv == 'true'
      with:
        version: ${{ steps.versions.outputs.UV_VERSION }}

    - name: gate tools (pinned in scripts/tool-versions.sh)
      if: inputs.gate-tools == 'true'
      shell: bash
      run: |
        cargo install cargo-mutants --version "${{ steps.versions.outputs.CARGO_MUTANTS_VERSION }}" --locked
        cargo install cargo-llvm-cov --version "${{ steps.versions.outputs.CARGO_LLVM_COV_VERSION }}" --locked

    - name: sqlx-cli
      if: inputs.sqlx == 'true'
      shell: bash
      run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
