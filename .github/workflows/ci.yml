# Every job runs a `just` command a developer can run locally by the same name.
# CI never has a secret extra step (docs/GITHUB.md section 3).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history, so the em-dash check can read every commit message on the PR (#18).
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - run: just fmt-check
      - run: just lint
        env:
          # Passed through env, never interpolated into the script: a PR body is untrusted text.
          EM_DASH_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  deps:
    name: crate boundaries (lmsr, protocol stay zero-IO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { node: 'false', foundry: 'false' }
      - run: just deps-check

  no-skips:
    name: no ignored, skipped, or focused tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-skipped-tests.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { node: 'false', foundry: 'false' }
      - run: just test-rust

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: tickline
          POSTGRES_PASSWORD: tickline
          POSTGRES_DB: tickline
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tickline" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://tickline:tickline@localhost:5433/tickline
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { node: 'false', foundry: 'false', sqlx: 'true' }
      - run: just migrate
      - run: just test-db

  sol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/setup
        with: { node: 'false' }
      - run: just test-sol
      - name: gas snapshot must not regress
        run: just snapshot --check

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { foundry: 'false' }
      - run: just test-ts

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history: a secret removed in a later commit still leaked
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gates every closed phase, so a regression in finished work blocks every PR. The phase in
  # progress has steps that cannot pass until it is done; its gate runs in phase-gate.yml at
  # close (ADR-0006).
  gate:
    name: just gate-closed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: tickline
          POSTGRES_PASSWORD: tickline
          POSTGRES_DB: tickline
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tickline" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://tickline:tickline@localhost:5433/tickline
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/setup
        with: { sqlx: 'true' }
      - run: just migrate
      - run: just gate-closed

  # The one check named in the branch ruleset. Jobs come and go over the phases;
  # this aggregator means the ruleset never has to change, and a skipped or cancelled
  # job fails the PR rather than passing silently.
  required:
    if: always()
    needs: [lint, deps, no-skips, rust, db, sol, ts, gitleaks, gate]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job must have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure')
                || contains(needs.*.result, 'cancelled')
                || contains(needs.*.result, 'skipped') }}; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
          echo "all required jobs succeeded"
